{# Permission checkboxes. Expects: permission_groups, selected_permissions, form.is_super_admin #}
<style>
  .perm-picker { text-align: left; }
  .perm-super {
    display: flex; gap: 12px; align-items: center; padding: 14px 16px; margin: 0 0 18px; cursor: pointer;
    border: 1px solid rgba(255, 122, 0, 0.35); background: rgba(255, 122, 0, 0.07); border-radius: 12px;
  }
  .perm-super .perm-super-icon {
    width: 38px; height: 38px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; background: rgba(255, 122, 0, 0.15); color: #ff7a00; font-size: 1.1rem;
  }
  .perm-super strong { display: block; color: #0f2a47; font-size: 0.92rem; }
  .perm-super small { display: block; color: #64748b; font-size: 0.78rem; line-height: 1.35; }
  .perm-super input { width: 20px; height: 20px; flex-shrink: 0; margin-left: auto; accent-color: #ff7a00; cursor: pointer; }

  .perm-groups { transition: opacity 0.2s ease; }
  .perm-picker.is-super .perm-groups { opacity: 0.4; pointer-events: none; }

  .perm-group { margin-bottom: 20px; }
  .perm-group:last-child { margin-bottom: 0; }
  .perm-group-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .perm-group-title {
    display: flex; align-items: center; gap: 8px; font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: #64748b;
  }
  .perm-group-title i { color: #054e97; font-size: 0.9rem; }
  .perm-toggle-group {
    border: 0; background: none; padding: 2px 8px; border-radius: 6px; font-size: 0.76rem; font-weight: 600;
    color: #054e97; cursor: pointer;
  }
  .perm-toggle-group:hover { background: rgba(5, 78, 151, 0.08); }

  .perm-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .perm-tile { position: relative; margin: 0; cursor: pointer; }
  .perm-tile input { position: absolute; opacity: 0; pointer-events: none; }
  .perm-tile-body {
    display: flex; gap: 10px; align-items: flex-start; height: 100%; padding: 12px 14px;
    background: #fff; border: 1px solid #e5eaf1; border-radius: 12px; transition: all 0.2s ease;
  }
  .perm-tile:hover .perm-tile-body { border-color: #c7d3e3; }
  .perm-check {
    width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    border: 1.5px solid #cbd5e1; border-radius: 6px; background: #fff; color: transparent; font-size: 0.8rem; transition: all 0.2s ease;
  }
  .perm-tile input:checked + .perm-tile-body { border-color: #054e97; background: rgba(5, 78, 151, 0.05); box-shadow: 0 0 0 1px #054e97 inset; }
  .perm-tile input:checked + .perm-tile-body .perm-check { background: #054e97; border-color: #054e97; color: #fff; }
  .perm-tile input:focus-visible + .perm-tile-body { outline: 2px solid #ff7a00; outline-offset: 2px; }
  .perm-label { display: block; font-size: 0.88rem; font-weight: 600; color: #0f2a47; line-height: 1.25; }
  .perm-desc { display: block; margin-top: 2px; font-size: 0.76rem; color: #64748b; line-height: 1.35; }

  @media (max-width: 640px) { .perm-tiles { grid-template-columns: 1fr; } }
</style>

<div class="perm-picker" id="permPicker">
  <label class="perm-super" for="isSuperAdmin">
    <span class="perm-super-icon"><i class="bi bi-stars"></i></span>
    <span>
      <strong>Super admin</strong>
      <small>Full access to everything, including creating and managing other admins. The choices below are ignored.</small>
    </span>
    {{ form.is_super_admin(id="isSuperAdmin") }}
  </label>

  <div class="perm-groups">
    {% for title, icon, perms in permission_groups %}
    <div class="perm-group">
      <div class="perm-group-head">
        <span class="perm-group-title"><i class="bi {{ icon }}"></i>{{ title }}</span>
        <button type="button" class="perm-toggle-group">Select all</button>
      </div>
      <div class="perm-tiles">
        {% for key, label, description in perms %}
        <label class="perm-tile">
          <input type="checkbox" name="permissions" value="{{ key }}" {% if key in selected_permissions %}checked{% endif %}>
          <span class="perm-tile-body">
            <span class="perm-check"><i class="bi bi-check-lg"></i></span>
            <span>
              <span class="perm-label">{{ label }}</span>
              <span class="perm-desc">{{ description }}</span>
            </span>
          </span>
        </label>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<script>
  (function () {
    var picker = document.getElementById('permPicker');
    var superBox = document.getElementById('isSuperAdmin');
    function sync() { picker.classList.toggle('is-super', superBox.checked); }
    superBox.addEventListener('change', sync);
    sync();

    function groupButtonLabel(group) {
      var boxes = group.querySelectorAll('input[type=checkbox]');
      var all = Array.prototype.every.call(boxes, function (b) { return b.checked; });
      group.querySelector('.perm-toggle-group').textContent = all ? 'Clear all' : 'Select all';
    }
    picker.querySelectorAll('.perm-group').forEach(function (group) {
      groupButtonLabel(group);
      group.addEventListener('change', function () { groupButtonLabel(group); });
      group.querySelector('.perm-toggle-group').addEventListener('click', function () {
        var boxes = group.querySelectorAll('input[type=checkbox]');
        var all = Array.prototype.every.call(boxes, function (b) { return b.checked; });
        boxes.forEach(function (b) { b.checked = !all; });
        groupButtonLabel(group);
        if (picker.closest('form')) picker.closest('form').dispatchEvent(new Event('permissions-changed'));
      });
    });
  })();
</script>
