{% extends 'base.html' %}
{% block title %}Confirm email change{% endblock %}
{% block content %}
<section class="page-container">
  <h1>Confirm your email change</h1>
  <p>Only continue if you requested this change. Existing login sessions will be signed out.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Confirm new email address</button>
  </form>
</section>
{% endblock %}
